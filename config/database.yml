default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: db/development/data.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/test/data.sqlite3

# Production databases live on the Fly volume mounted at /data (see fly.toml).
# The primary path matches where the app has always stored production data.
production:
  primary:
    <<: *default
    database: /data/production.sqlite3
  cache:
    <<: *default
    database: /data/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: /data/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: /data/production_cable.sqlite3
    migrations_paths: db/cable_migrate
